spring:
  application:
    name: squares-server
  datasource:
    url: ${SQUARES_DATABASE_URL:jdbc:postgresql://localhost:5432/squares}
    username: ${SQUARES_DATABASE_USERNAME:squares}
    password: ${SQUARES_DATABASE_PASSWORD:squares-local}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

humblej:
  identity:
    oidc:
      issuer: ${SQUARES_OIDC_ISSUER:http://localhost:9090/realms/squares}
      audience: ${SQUARES_OIDC_AUDIENCE:squares-api}
      jwk-set-uri: ${SQUARES_OIDC_JWK_SET_URI:http://localhost:9090/realms/squares/protocol/openid-connect/certs}

squares:
  metadata:
    api-version: ${SQUARES_API_VERSION:v1}
    current-rules-version: ${SQUARES_CURRENT_RULES_VERSION:1}
    minimum-windows-version: ${SQUARES_MINIMUM_WINDOWS_VERSION:4.3.0}
    minimum-android-version: ${SQUARES_MINIMUM_ANDROID_VERSION:1.0.0}
